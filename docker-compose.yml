services:
  merge-api:
    build: .
    image: config-merge-rehearsal-api:latest
    container_name: config-merge-rehearsal-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      STORE_MAX: 1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
